# Keep Android builds usable on an 8 GiB development machine. The Kotlin
# compiler runs in a separate JVM, so both processes need an explicit limit.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m

# Avoid memory spikes from Gradle scheduling all six CPU workers at once.
org.gradle.workers.max=2
org.gradle.parallel=false

# Release daemon memory reasonably soon after the last build (15 minutes).
org.gradle.daemon.idletimeout=900000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
