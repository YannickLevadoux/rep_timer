name: Issue lifecycle

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "clean/**"

  pull_request:
    types:
      - opened
      - closed

  delete:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-lifecycle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  #
  # --------------------------------------------------------------------------
  # Push -> ready => in-progress
  # --------------------------------------------------------------------------
  #

  mark-in-progress:

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Extract issue number
        id: extract
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ ! "$BRANCH" =~ ^(feature|bugfix|hotfix|clean)/([0-9]+)-.*$ ]]; then
            echo "::error::Branch '$BRANCH' does not follow the required naming convention."
            exit 1
          fi

          echo "issue=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Update issue labels
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const path = require("path");

            const {
              notice,
              warning,
              failure,
              writeSummary,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github",
              "scripts",
              "workflow-utils.js"
            ));

            const issue = Number("${{ steps.extract.outputs.issue }}");
            const { owner, repo } = context.repo;

            const { data } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issue
            });

            const labels = data.labels.map(l => l.name);

            const hasReady = labels.includes("ready");
            const hasInProgress = labels.includes("in-progress");

            if (hasReady) {

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue,
                  name: "ready"
                });
              } catch (_) {}

              if (!hasInProgress) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue,
                  labels: ["in-progress"]
                });
              }

              notice(`Issue #${issue}: removed label 'ready'.`);
              notice(`Issue #${issue}: added label 'in-progress'.`);
              return;
            }

            if (hasInProgress) {
              warning(`Issue #${issue}: already in progress.`);
              return;
            }

            failure(`Issue #${issue}: expected label 'ready' or 'in-progress'.`);

            await writeSummary(`Issue lifecycle : Issue #${issue}`);

            core.setFailed("Invalid issue state.");
            );

  #
  # --------------------------------------------------------------------------
  # PR opened -> prepend Related to #xx
  # --------------------------------------------------------------------------
  #

  update-pr:

    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    runs-on: ubuntu-latest

    steps:

      - name: Update PR description
        uses: actions/github-script@v7.0.1
        with:
          script: |

            const path = require("path");

            const {
              notice,
              warning,
              failure,
              writeSummary,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github",
              "scripts",
              "workflow-utils.js"
            ));

            const branch = context.payload.pull_request.head.ref;

            const match = branch.match(/^(feature|bugfix|hotfix|clean)\/([0-9]+)-/);

            if (!match) {
              core.setFailed("Invalid branch name.");
              return;
            }

            const issue = match[2];

            let body = context.payload.pull_request.body ?? "";

            if (!body.includes(`Related to #${issue}`)) {

              body = `Related to #${issue}\n\n${body}`;

              await github.rest.pulls.update({
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                body
              });
            }

  #
  # --------------------------------------------------------------------------
  # PR merged -> remove in-progress
  # --------------------------------------------------------------------------
  #

  merged:

    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:

      - name: Remove in-progress label
        uses: actions/github-script@v7.0.1
        with:
          script: |

            const path = require("path");

            const {
              notice,
              warning,
              failure,
              writeSummary,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github",
              "scripts",
              "workflow-utils.js"
            ));

            const branch = context.payload.pull_request.head.ref;

            const match = branch.match(/^(feature|bugfix|hotfix|clean)\/([0-9]+)-/);

            if (!match)
              return;

            const issue = Number(match[2]);

            try {

              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue,
                name: "in-progress"
              });

            } catch (_) {
              // already removed
            }

  #
  # --------------------------------------------------------------------------
  # Branch deleted -> remove in-progress if issue still open
  # --------------------------------------------------------------------------
  #

  deleted:

    if: >
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch'

    runs-on: ubuntu-latest

    steps:

      - name: Remove in-progress label
        uses: actions/github-script@v7.0.1
        with:
          script: |

            const path = require("path");

            const {
              notice,
              warning,
              failure,
              writeSummary,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github",
              "scripts",
              "workflow-utils.js"
            ));
      
            const branch = context.payload.ref;

            const match = branch.match(/^(feature|bugfix|hotfix|clean)\/([0-9]+)-/);

            if (!match)
              return;

            const issue = Number(match[2]);

            const { data } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issue
            });

            if (data.state !== "open")
              return;

            try {

              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue,
                name: "in-progress"
              });

            } catch (_) {
              // already removed
            }