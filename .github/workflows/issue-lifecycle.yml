name: Issue lifecycle

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "clean/**"

  pull_request:
    types:
      - opened
      - closed

  delete:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-lifecycle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  #
  # --------------------------------------------------------------------------
  # Push -> ready => in-progress
  # --------------------------------------------------------------------------
  #

  mark-in-progress:

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Extract issue number
        id: extract
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          PATTERN='^(feature|bugfix|hotfix|clean)/([0-9]+)-.*$'

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            MESSAGE="Branch '$BRANCH' does not follow the required naming convention."

            echo "::error::$MESSAGE"

            {
              echo "## Issue lifecycle"
              echo
              echo "| Status | Action |"
              echo "| ------ | ------ |"
              echo "| ❌ | $MESSAGE |"
              echo
              echo "**Expected format:**"
              echo
              echo "- feature/33-my-feature"
              echo "- bugfix/61-my-bugfix"
              echo "- hotfix/85-my-hotfix"
              echo "- clean/76-my-cleanup"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          ISSUE="${BASH_REMATCH[2]}"

          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

          echo "::notice::Branch '$BRANCH' is linked to issue #$ISSUE."

          {
            echo "## Issue lifecycle"
            echo
            echo "| Status | Action |"
            echo "| ------ | ------ |"
            echo "| ✅ | Branch '$BRANCH' linked to issue #$ISSUE |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update issue labels
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const path = require("path");

            const {
              notice,
              warning,
              failure,
              writeSummary,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github",
              "scripts",
              "workflow-utils.js"
            ))(core);

            const issue = Number("${{ steps.extract.outputs.issue }}");
            const { owner, repo } = context.repo;

            const { data } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issue,
            });

            const labels = data.labels.map(label => label.name);

            const hasReady = labels.includes("ready");
            const hasInProgress = labels.includes("in-progress");

            if (hasReady) {

              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issue,
                name: "ready",
              });

              notice(`Issue #${issue}: removed label 'ready'.`);

              if (!hasInProgress) {

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue,
                  labels: ["in-progress"],
                });

                notice(`Issue #${issue}: added label 'in-progress'.`);

              } else {

                warning(`Issue #${issue}: label 'in-progress' already exists.`);

              }

              await writeSummary(`Issue lifecycle - Issue #${issue}`);
              return;
            }

            if (hasInProgress) {

              warning(`Issue #${issue}: already in progress.`);

              await writeSummary(`Issue lifecycle - Issue #${issue}`);
              return;
            }

            failure(`Issue #${issue}: expected label 'ready' or 'in-progress'.`);

            await writeSummary(`Issue lifecycle - Issue #${issue}`);

            core.setFailed("Invalid issue state.");

  #
  # --------------------------------------------------------------------------
  # PR opened -> prepend Related to #xx
  # --------------------------------------------------------------------------
  #

  update-pr:

    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Update PR description
      uses: actions/github-script@v7.0.1
      with:
        script: |
          const path = require("path");

          const {
            notice,
            warning,
            failure,
            writeSummary,
          } = require(path.join(
            process.env.GITHUB_WORKSPACE,
            ".github",
            "scripts",
            "workflow-utils.js"
          ))(core);

          const branch = context.payload.pull_request.head.ref;

          const match = branch.match(/^(feature|bugfix|hotfix|clean)\/([0-9]+)-/);

          if (!match) {
            failure(`Branch '${branch}' does not follow the required naming convention.`);
            await writeSummary("Issue lifecycle");
            core.setFailed("Invalid branch name.");
            return;
          }

          const issue = match[2];

          let body = context.payload.pull_request.body ?? "";

          if (body.includes(`Related to #${issue}`)) {
            warning(`PR already references issue #${issue}.`);
            await writeSummary(`Issue lifecycle - Issue #${issue}`);
            return;
          }

          body = `Related to #${issue}\n\n${body}`;

          await github.rest.pulls.update({
            ...context.repo,
            pull_number: context.payload.pull_request.number,
            body,
          });

          notice(`PR description updated with 'Related to #${issue}'.`);

          await writeSummary(`Issue lifecycle - Issue #${issue}`);

  #
  # --------------------------------------------------------------------------
  # PR merged -> remove in-progress
  # --------------------------------------------------------------------------
  #

  merged:

    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Remove in-progress label
      uses: actions/github-script@v7.0.1
      with:
        script: |
          const path = require("path");

          const {
            notice,
            warning,
            failure,
            writeSummary,
          } = require(path.join(
            process.env.GITHUB_WORKSPACE,
            ".github",
            "scripts",
            "workflow-utils.js"
          ))(core);

          const branch = context.payload.pull_request.head.ref;

          const match = branch.match(/^(feature|bugfix|hotfix|clean)\/([0-9]+)-/);

          if (!match) {
            failure(`Branch '${branch}' does not follow the required naming convention.`);
            await writeSummary("Issue lifecycle");
            core.setFailed("Invalid branch name.");
            return;
          }

          const issue = Number(match[2]);

          const { data } = await github.rest.issues.get({
            ...context.repo,
            issue_number: issue,
          });

          const labels = data.labels.map(label => label.name);

          if (!labels.includes("in-progress")) {
            warning(`Issue #${issue}: label 'in-progress' is already absent.`);
          } else {
            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: issue,
              name: "in-progress",
            });

            notice(`Issue #${issue}: removed label 'in-progress'.`);
          }

          const closeRegex = new RegExp(`\\bcloses?\\s+#${issue}\\b`, "i");

          let shouldClose = closeRegex.test(context.payload.pull_request.body ?? "");

          if (!shouldClose) {
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
            });

            shouldClose = comments.some(comment =>
              closeRegex.test(comment.body ?? "")
            );
          }

          if (shouldClose) {
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue,
              state: "closed",
            });

            notice(`Issue #${issue}: closed.`);
          } else {
            warning(`Issue #${issue}: no 'Close #${issue}' or 'Closes #${issue}' directive found in PR description or comments.`);
          }

          await writeSummary(`Issue lifecycle - Issue #${issue}`);

  #
  # --------------------------------------------------------------------------
  # Branch deleted -> remove in-progress if issue still open
  # --------------------------------------------------------------------------
  #

  deleted:

    if: >
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch'

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Remove in-progress label
      uses: actions/github-script@v7.0.1
      with:
        script: |
          const path = require("path");

          const {
            notice,
            warning,
            failure,
            writeSummary,
          } = require(path.join(
            process.env.GITHUB_WORKSPACE,
            ".github",
            "scripts",
            "workflow-utils.js"
          ))(core);

          const branch = context.payload.ref;

          const match = branch.match(/^(feature|bugfix|hotfix|clean)\/([0-9]+)-/);

          if (!match) {
            failure(`Branch '${branch}' does not follow the required naming convention.`);
            await writeSummary("Issue lifecycle");
            core.setFailed("Invalid branch name.");
            return;
          }

          const issue = Number(match[2]);

          const { data } = await github.rest.issues.get({
            ...context.repo,
            issue_number: issue,
          });

          if (data.state !== "open") {
            warning(`Issue #${issue}: already closed.`);
            await writeSummary(`Issue lifecycle - Issue #${issue}`);
            return;
          }

          const labels = data.labels.map(label => label.name);

          if (!labels.includes("in-progress")) {
            warning(`Issue #${issue}: label 'in-progress' is already absent.`);
            await writeSummary(`Issue lifecycle - Issue #${issue}`);
            return;
          }

          await github.rest.issues.removeLabel({
            ...context.repo,
            issue_number: issue,
            name: "in-progress",
          });

          notice(`Issue #${issue}: removed label 'in-progress'.`);

          await writeSummary(`Issue lifecycle - Issue #${issue}`);