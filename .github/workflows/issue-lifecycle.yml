name: Issue lifecycle

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "clean/**"

  pull_request:
    types:
      - closed

  delete:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-lifecycle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  #
  # --------------------------------------------------------------------------
  # sync-issue-and-pr: when pushing a product branch
  # - Validate the branch naming convention and extract the issue number
  # - Move the issue from ready to in-progress
  # - Create or verify a pull request to main with a closing directive
  # --------------------------------------------------------------------------
  #

  sync-issue-and-pr:

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Sync issue and pull request
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN }}
          script: |
            const path = require("path");

            const {
              notice,
              info,
              failure,
              writeSummary,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github",
              "scripts",
              "workflow-utils.js"
            ))(core);

            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const match = branch.match(
              /^(feature|bugfix|hotfix|clean)\/([0-9]+)-.+$/
            );

            let summaryTitle = "Issue lifecycle";

            try {
              if (!match) {
                failure(
                  `Branch '${branch}' does not follow the required naming convention.`
                );
                core.setFailed("Invalid branch name.");
                return;
              }

              const issue = Number(match[2]);
              summaryTitle = `Issue lifecycle - Issue #${issue}`;

              info(`Branch '${branch}' is linked to issue #${issue}.`);

              const { data: issueData } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issue,
              });

              if (issueData.state !== "open") {
                failure(`Issue #${issue}: expected an open issue.`);
                core.setFailed("Invalid issue state.");
                return;
              }

              const labels = issueData.labels.map(label =>
                typeof label === "string" ? label : label.name
              );

              const hasReady = labels.includes("ready");
              const hasInProgress = labels.includes("in-progress");

              if (!hasReady && !hasInProgress) {
                failure(
                  `Issue #${issue}: expected label 'ready' or 'in-progress'.`
                );
                core.setFailed("Invalid issue state.");
                return;
              }

              if (!hasInProgress) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue,
                  labels: ["in-progress"],
                });

                notice(`Issue #${issue}: added label 'in-progress'.`);
              } else {
                info(`Issue #${issue}: label 'in-progress' already exists.`);
              }

              if (hasReady) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue,
                  name: "ready",
                });

                notice(`Issue #${issue}: removed label 'ready'.`);
              }

              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${branch}`,
                base: "main",
                per_page: 100,
              });

              let pullRequest = pullRequests[0];

              if (!pullRequest) {
                const { data: createdPullRequest } = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `#${issue} - ${issueData.title}`,
                  head: branch,
                  base: "main",
                  body: `Closes #${issue}\n\n> 🤖 Pull request créée automatiquement par GitHub Actions.`,
                });

                pullRequest = createdPullRequest;
                notice(
                  `Pull request #${pullRequest.number}: created towards 'main'.`
                );
                notice(
                  `Pull request #${pullRequest.number}: added 'Closes #${issue}'.`
                );
              } else {
                info(
                  `Pull request #${pullRequest.number}: already targets 'main'.`
                );

                const closeRegex = new RegExp(
                  `\\bcloses\\s+#${issue}\\b`,
                  "i"
                );

                if (closeRegex.test(pullRequest.body ?? "")) {
                  info(
                    `Pull request #${pullRequest.number}: already references issue #${issue}.`
                  );
                } else {
                  const currentBody = pullRequest.body ?? "";
                  const body = currentBody.trim()
                    ? `Closes #${issue}\n\n${currentBody}`
                    : `Closes #${issue}`;

                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pullRequest.number,
                    body,
                  });

                  notice(
                    `Pull request #${pullRequest.number}: added 'Closes #${issue}'.`
                  );
                }
              }
            } catch (error) {
              failure(
                `Issue and pull request synchronization failed: ${error.message}`
              );
              core.setFailed(error.message);
            } finally {
              await writeSummary(summaryTitle);
            }

  #
  # --------------------------------------------------------------------------
  # merged: when a PR is merged
  # - Remove in-progress label : 
  #    - Remove in-progress label on PR
  #    - Close issue if PR description or comments contain 'Close #xx' or 'Closes #xx'
  # --------------------------------------------------------------------------
  #

  merged:

    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'renovate/')

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Complete linked issue
      uses: actions/github-script@v9.0.0
      with:
        script: |
          const path = require("path");

          const {
            notice,
            info,
            failure,
            writeSummary,
          } = require(path.join(
            process.env.GITHUB_WORKSPACE,
            ".github",
            "scripts",
            "workflow-utils.js"
          ))(core);

          const branch = context.payload.pull_request.head.ref;
          const match = branch.match(
            /^(feature|bugfix|hotfix|clean)\/([0-9]+)-.+$/
          );

          let summaryTitle = "Issue lifecycle";

          try {
            if (!match) {
              info(`Branch '${branch}': no linked issue, nothing to do.`);
              return;
            }

            const issue = Number(match[2]);
            summaryTitle = `Issue lifecycle - Issue #${issue}`;

            info(`Branch '${branch}' is linked to issue #${issue}.`);

            const { data: issueData } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issue,
            });

            const labels = issueData.labels.map(label =>
              typeof label === "string" ? label : label.name
            );

            if (!labels.includes("in-progress")) {
              info(`Issue #${issue}: label 'in-progress' is already absent.`);
            } else {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue,
                name: "in-progress",
              });

              notice(`Issue #${issue}: removed label 'in-progress'.`);
            }

            const closeRegex = new RegExp(`\\bcloses?\\s+#${issue}\\b`, "i");

            let shouldClose = closeRegex.test(
              context.payload.pull_request.body ?? ""
            );

            if (!shouldClose) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  ...context.repo,
                  issue_number: context.payload.pull_request.number,
                  per_page: 100,
                }
              );

              shouldClose = comments.some(comment =>
                closeRegex.test(comment.body ?? "")
              );
            }

            if (!shouldClose) {
              info(
                `Issue #${issue}: no 'Close #${issue}' or 'Closes #${issue}' directive found, nothing to close.`
              );
            } else if (issueData.state === "closed") {
              info(`Issue #${issue}: already closed.`);
            } else {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue,
                state: "closed",
              });

              notice(`Issue #${issue}: closed.`);
            }
          } catch (error) {
            failure(`Linked issue completion failed: ${error.message}`);
            core.setFailed(error.message);
          } finally {
            await writeSummary(summaryTitle);
          }

  #
  # --------------------------------------------------------------------------
  # deleted: when a branch is deleted
  # - Remove in-progress label : remove in-progress label on PR if issue still open
  # --------------------------------------------------------------------------
  #

  deleted:

    if: >
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      !startsWith(github.event.ref, 'renovate/')

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Clean up linked issue
      uses: actions/github-script@v9.0.0
      with:
        script: |
          const path = require("path");

          const {
            notice,
            info,
            failure,
            writeSummary,
          } = require(path.join(
            process.env.GITHUB_WORKSPACE,
            ".github",
            "scripts",
            "workflow-utils.js"
          ))(core);

          const branch = context.payload.ref;
          const match = branch.match(
            /^(feature|bugfix|hotfix|clean)\/([0-9]+)-.+$/
          );

          let summaryTitle = "Issue lifecycle";

          try {
            if (!match) {
              info(`Branch '${branch}': no linked issue, nothing to do.`);
              return;
            }

            const issue = Number(match[2]);
            summaryTitle = `Issue lifecycle - Issue #${issue}`;

            info(`Branch '${branch}' is linked to issue #${issue}.`);

            const { data: issueData } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issue,
            });

            if (issueData.state !== "open") {
              info(`Issue #${issue}: already closed, nothing to clean up.`);
              return;
            }

            const labels = issueData.labels.map(label =>
              typeof label === "string" ? label : label.name
            );

            if (!labels.includes("in-progress")) {
              info(
                `Issue #${issue}: label 'in-progress' is already absent, nothing to clean up.`
              );
              return;
            }

            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: issue,
              name: "in-progress",
            });

            notice(`Issue #${issue}: removed label 'in-progress'.`);
          } catch (error) {
            failure(`Linked issue cleanup failed: ${error.message}`);
            core.setFailed(error.message);
          } finally {
            await writeSummary(summaryTitle);
          }
