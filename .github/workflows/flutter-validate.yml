name: Flutter validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Report large files in lib
        continue-on-error: true
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");

            const { writeFileLengthSummary } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              ".github",
              "scripts",
              "workflow-utils.js"
            ))(core);

            const workspace = process.env.GITHUB_WORKSPACE;

            const trackedFiles = execFileSync(
              "git",
              ["ls-files", "-z", "--", "lib"],
              { cwd: workspace, encoding: "utf8" }
            )
              .split("\0")
              .filter(file => file.endsWith(".dart"));

            function countLines(contents) {
              if (contents.length === 0) {
                return 0;
              }

              const lineBreaks = contents.match(/\r\n|\r|\n/g)?.length ?? 0;
              const endsWithLineBreak = /(?:\r\n|\r|\n)$/.test(contents);

              return lineBreaks + (endsWithLineBreak ? 0 : 1);
            }

            const files = trackedFiles.map(file => ({
              path: file,
              lines: countLines(fs.readFileSync(path.join(workspace, file), "utf8")),
            }));

            await writeFileLengthSummary(files);

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: |
          # TODO:
          # Remove --no-fatal-infos once all analyzer infos have been fixed.
          flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check and summarize coverage
        if: ${{ !cancelled() }}
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: dart .github/scripts/coverage_report.dart coverage/lcov.info

      - name: Upload LCOV report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
